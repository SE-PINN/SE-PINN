[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sepinn"
version = "1.0.0"
description = "Solving the Schrödinger Equation via Physics-Informed Machine Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib >= 3.7.1",
    "numpy >= 1.23.5",
    "rich >= 13.0.0",
    "scipy >= 1.11.4",
    "torch >= 2.2.0"
]

[project.optional-dependencies]
notebook = ["IPython", "matplotlib-inline"]

[project.urls]
Repository = "https://github.com/SE-PINN/SE-PINN"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.8",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
